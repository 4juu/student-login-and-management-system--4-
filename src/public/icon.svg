<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- ألوان الخلفية المتدرجة (نيلي وكحلي فخم) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <!-- ألوان الإضاءة -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearOption>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- الخلفية الرئيسية -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- الرسمة الذكية بالوسط (شبكة عصبية + قفل حماية) -->
  <g transform="translate(0, -20)">
    <!-- حلقة الإضاءة الخارجية -->
    <circle cx="256" cy="220" r="110" fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#glow)" opacity="0.5"/>
    <circle cx="256" cy="220" r="110" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="20 10"/>

    <!-- الشبكة العصبية المترابطة -->
    <path d="M256 140 L190 190 L190 250 L256 300 L322 250 L322 190 Z" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7"/>
    
    <!-- النقاط الذكية (Nodes) -->
    <circle cx="256" cy="140" r="8" fill="#fff" filter="url(#glow)"/>
    <circle cx="190" cy="190" r="7" fill="#38bdf8"/>
    <circle cx="190" cy="250" r="7" fill="#818cf8"/>
    <circle cx="256" cy="300" r="8" fill="#fff" filter="url(#glow)"/>
    <circle cx="322" cy="250" r="7" fill="#38bdf8"/>
    <circle cx="322" cy="190" r="7" fill="#818cf8"/>

    <!-- خطوط الاتصال بالمركز -->
    <line x1="256" y1="140" x2="256" y2="300" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
    <line x1="190" y1="190" x2="322" y2="250" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
    <line x1="190" y1="250" x2="322" y2="190" stroke="#818cf8" stroke-width="2" opacity="0.4"/>

    <!-- القلب: أيقونة القفل الذكي -->
    <rect x="238" y="204" width="36" height="28" rx="6" fill="#ffffff" filter="url(#glow)"/>
    <path d="M244 204 V192 C244 184 268 184 268 192 V204" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="256" cy="218" r="4" fill="#1e1b4b"/>
  </g>

  <!-- النص الأول: اسم النظام (حديث وبارز) -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    Ai Login System
  </text>

  <!-- النص الثاني: اسمك دكتور (صغير جداً، متباعد، وواضح كالكريستال) -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="5" opacity="0.9">
    BY PH. MUJTABA
  </text>
</svg>